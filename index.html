<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Card</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 20% 20%, #fbe8ef 0%, #f5d9e5 30%, #f0cddc 60%, #eac2d5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* Envelope Styles (provided structure, pastel theme) */
        .envelope-wrapper {
            position: relative;
            width: 220px;
            height: 130px;
            cursor: pointer;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.12));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .envelope {
            width: 100%;
            height: 100%;
            position: relative;
            perspective: 1000px;
            background: transparent;
            border-radius: 0 0 14px 14px;
            transform-style: preserve-3d;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
            border: none;
            overflow: hidden;
        }

        .msg {
            bottom: 0;
            left: 9%;
            width: 82%;
            height: 78%;
            color: #111;
            transition: 0.5s;
            position: absolute;
            text-align: center;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        }

        .msg::before,
        .msg::after {
            content: '';
            left: 6%;
            height: 10px;
            position: absolute;
            border-radius: 50px;
            background: #f1d7e3;
        }

        .msg::before { top: 18%; width: 45%; }
        .msg::after { top: 42%; width: 55%; }

        .count {
            top: -18%;
            right: -10%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            opacity: 0;
            font-weight: 600;
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            font-family: 'Poppins', sans-serif;
            background: #f46868;
            color: #fff;
            box-shadow: 0 0 2px 1px #47464661;
            transition: transform 1s 0.5s, opacity 1s 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-part,
        .right-part {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            bottom: 0;
            filter: drop-shadow(0px 0px 1px rgba(0, 0, 0, 0.25));
            background: #f4c7d6;
        }

        .left-part::before,
        .right-part::before,
        .top-part::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 0 0 14px 14px;
        }

        .left-part::before {
            clip-path: polygon(0 0, 100% 100%, 0 100%);
            background: #f3c7d7;
        }

        .right-part::before {
            background: #f0b9cc;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .top-part {
            width: 100%;
            height: 60%;
            position: absolute;
            transition: 1s 0.2s;
            transform-origin: top;
            transform: rotateX(1deg);
            filter: drop-shadow(0px 1px 1px rgba(0, 0, 0, 0.2));
            z-index: 3;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background: #ea9bb8;
        }

        /* inverted scallops carved into the flap edge */
        .top-part::before,
        .top-part::after {
            content: '';
            position: absolute;
            width: 90%;
            height: 16px;
            background-image: radial-gradient(circle at 9px 9px, #f8e4eb 9px, transparent 9px);
            background-size: 18px 18px;
            background-repeat: repeat-x;
            bottom: -9px;
            opacity: 0.9;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.12));
        }

        .top-part::before {
            left: 50%;
            transform-origin: right center;
            transform: translateX(-100%) rotate(29deg);
        }

        .top-part::after {
            left: 50%;
            transform-origin: left center;
            transform: rotate(-29deg);
        }

        .envelope.open .msg {
            transform: translateY(-50px);
            transition: 1.5s 0.2s !important;
            z-index: 3;
        }

        .envelope.open .count {
            transform: scale(1);
            opacity: 1;
        }

        .envelope.open .top-part {
            transform: rotateX(190deg);
            transition: 0.5s !important;
            filter: none;
        }

        .envelope-instruction {
            margin-top: 0;
            font-family: 'Dancing Script', cursive;
            font-size: 18px;
            color: #3a3a3a;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.08);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Gallery Styles */
        .gallery-section {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(4px);
        }

        .gallery-title {
            font-family: 'Dancing Script', cursive;
            font-size: 34px;
            color: #d14b7a;
            text-align: center;
            margin-bottom: 22px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            align-items: start; /* prevent items stretching to the tallest row */
        }

        .gallery-item {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            background: linear-gradient(135deg, #f6d6e2, #f1c6d9);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            height: auto; /* allow cards to size to their own content */
        }

        .media-frame {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
        }

        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .gallery-media { width: 100%; height: 100%; object-fit: cover; display: block; }

        .gallery-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: #c24b77;
            text-align: center;
            padding: 18px;
        }

        .gallery-item.unavailable {
            cursor: default;
            pointer-events: none;
        }

        .gallery-item .blur-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #5b2a41;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 18px;
            background: rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(6px);
            letter-spacing: 0.3px;
        }

        .item-meta {
            padding: 12px 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255, 255, 255, 0.82);
            color: #4a2740;
        }

        .item-title {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            line-height: 1.2;
            color: #bf2f67;
        }

        .item-caption {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            max-height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            transition: max-height 0.3s ease;
        }

        .item-caption.expanded {
            -webkit-line-clamp: unset;
            max-height: 500px;
        }

        .read-more {
            align-self: flex-start;
            background: #e56997;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            letter-spacing: 0.2px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(229, 105, 151, 0.28);
        }

        .read-more:hover { background: #d55584; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            position: relative;
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 24px;
            z-index: 3;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s ease;
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-close {
            position: absolute;
            top: 8px; /* Adjusted for better alignment */
            right: 8px; /* Adjusted for better alignment */
            background: #e56997;
            color: white;
            border: none;
            width: 36px; /* Adjusted size */
            height: 36px; /* Adjusted size */
            border-radius: 50%;
            font-size: 20px; /* Adjusted font size */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(229, 105, 151, 0.32);
        }

        .modal-close:hover {
            background: #d55584;
        }

        /* Letter Modal */
        .letter-wrapper {
            position: relative;
            background: linear-gradient(135deg, #fff7fb, #ffe4f0);
            border: 1px solid #f3c9da;
            border-radius: 18px;
            padding: 26px 22px 30px;
            box-shadow: inset 0 1px 0 #fff, 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .letter-wrapper::before,
        .letter-wrapper::after {
            content: '';
            position: absolute;
            left: 18px;
            right: 18px;
            height: 10px;
            border-radius: 8px;
            background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(227, 144, 176, 0.25) 12px 18px);
            opacity: 0.7;
        }

        .letter-wrapper::before { top: 12px; }
        .letter-wrapper::after { bottom: 12px; transform: scaleX(-1); }

        .letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: #111;
            line-height: 1.8;
            text-align: center;
        }

        .letter-content h2 { font-size: 32px; margin-bottom: 18px; color: #111; }
        .letter-content p { margin-bottom: 15px; }
        .letter-signature { margin-top: 26px; font-size: 26px; color: #111; font-weight: 600; }

        /* Image Modal */
        .image-modal-content { padding: 0; background: transparent; max-width: 90vw; max-height: 90vh; }
        .image-modal-content img { width: 100%; height: auto; border-radius: 20px; box-shadow: 0 18px 52px rgba(0, 0, 0, 0.4); }
        .image-modal-content .modal-close { top: -50px; right: -10px; }

        /* Responsive Design (mobile first) */
        @media (min-width: 540px) {
            .envelope-wrapper { width: 260px; height: 150px; }
            .gallery-section { padding: 32px 26px; }
            .gallery-title { font-size: 36px; }
        }

        @media (min-width: 820px) {
            .envelope-wrapper { width: 320px; height: 180px; }
            .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
            .gallery-section { padding: 38px 32px; }
        }

        /* Hearts Animation */
        .heart {
            position: fixed;
            color: #e56997;
            font-size: 20px;
            animation: floatHeart 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <!-- Envelope Section -->
        <div class="envelope-wrapper">
            <div class="envelope" id="envelope">
                <div class="top-part"></div>
                <div class="right-part"></div>
                <div class="left-part"></div>
            </div>
            <div class="envelope-instruction">Click the envelope</div>
        </div>

        <!-- Gallery Section -->
        <div class="gallery-section">
            <h2 class="gallery-title">Our Memories Together ❤️</h2>
            <div class="gallery-grid" id="gallery">
                <div class="gallery-item" data-image="1" data-available="true">
                    <div class="media-frame">
                        <img src="sample image.jpg" alt="Photo 1" class="gallery-media">
                    </div>
                    <div class="item-meta">
                        <h3 class="item-title">SMILE</h3>
                        <p class="item-caption">sample image
                            text here
                        </p>
                    </div>
                </div>
                <div class="gallery-item" data-image="2" data-available="true">
                    <div class="media-frame">
                        <img src="sample image.jpg" alt="Photo 2" class="gallery-media">
                    </div>
                    <div class="item-meta">
                        <h3 class="item-title">Smile</h3>
                        <p class="item-caption"> text here
                            </p>
                    </div>
                </div>
                <div class="gallery-item unavailable" data-available="false">
                    <div class="blur-overlay">Some more memories we need to make 💫</div>
                </div>
                <div class="gallery-item unavailable" data-available="false">
                    <div class="blur-overlay">More adventures coming soon ✨</div>
                </div>
                <div class="gallery-item unavailable" data-available="false">
                    <div class="blur-overlay">Let’s add another snapshot 📸</div>
                </div>
                <div class="gallery-item unavailable" data-available="false">
                    <div class="blur-overlay">Saving space for us ❤️</div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>Made with lots of love</span><span class="dot">•</span><span>More memories loading soon</span>
        </footer>
    </div>

    <!-- Letter Modal -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <button class="modal-close" id="closeLetterModal">&times;</button>
            <div class="letter-wrapper">
                <div class="letter-content">
                    <h2>My Dearest</h2>
<p> text here</p>
                    
                    <div class="letter-signature">text here</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal">
        <div class="modal-content image-modal-content">
            <button class="modal-close" id="closeImageModal">&times;</button>
            <img id="modalImage" src="" alt="Gallery Image">
        </div>
    </div>

    <script>
        // Envelope functionality
        const envelope = document.getElementById('envelope');
        const letterModal = document.getElementById('letterModal');
        const closeLetterModal = document.getElementById('closeLetterModal');

        envelope.addEventListener('click', () => {
            envelope.classList.add('open');
            setTimeout(() => {
                letterModal.classList.add('active');
                createHearts();
            }, 400);
        });

        closeLetterModal.addEventListener('click', (e) => {
            e.stopPropagation();
            letterModal.classList.remove('active');
            envelope.classList.remove('open');
        });

        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) {
                letterModal.classList.remove('active');
                envelope.classList.remove('open');
            }
        });

        // Gallery functionality
        const galleryItems = document.querySelectorAll('.gallery-item');
        const imageModal = document.getElementById('imageModal');
        const closeImageModal = document.getElementById('closeImageModal');
        const modalImage = document.getElementById('modalImage');

        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                if (item.dataset.available !== 'true') return;

                const media = item.querySelector('img, video');
                if (media && media.tagName === 'IMG') {
                    modalImage.src = media.currentSrc || media.src;
                } else {
                    const imageNumber = item.dataset.image;
                    const canvas = document.createElement('canvas');
                    canvas.width = 600;
                    canvas.height = 600;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createLinearGradient(0, 0, 600, 600);
                    gradient.addColorStop(0, '#f5d6e2');
                    gradient.addColorStop(1, '#f0c8d8');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 600, 600);
                    ctx.fillStyle = '#c24b77';
                    ctx.font = '48px Dancing Script, cursive';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`Photo ${imageNumber || ''}`, 300, 280);
                    ctx.font = '72px Arial';
                    ctx.fillText(['❤️', '💕', '💖', '💗', '💓', '💝'][(imageNumber || 1) - 1], 300, 350);
                    modalImage.src = canvas.toDataURL();
                }

                imageModal.classList.add('active');
                createHearts();
            });
        });

        // Read more toggles for captions
        const captions = document.querySelectorAll('.item-caption');
        captions.forEach(caption => {
            // Force clamp measurement
            const needsMore = caption.scrollHeight > caption.clientHeight + 2;
            if (!needsMore) return;

            const btn = document.createElement('button');
            btn.className = 'read-more';
            btn.textContent = 'Read more...';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const expanded = caption.classList.toggle('expanded');
                btn.textContent = expanded ? 'Read less' : 'Read more...';
            });

            caption.parentElement.appendChild(btn);
        });

        closeImageModal.addEventListener('click', (e) => {
            e.stopPropagation();
            imageModal.classList.remove('active');
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
            }
        });

        // Close modals with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                letterModal.classList.remove('active');
                envelope.classList.remove('open');
                imageModal.classList.remove('active');
            }
        });

        // Floating hearts animation
        function createHearts() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '❤️';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, 4000);
                }, i * 200);
            }
        }

        window.addEventListener('load', () => { setInterval(createHearts, 5000); });
    </script>
</body>
</html>
